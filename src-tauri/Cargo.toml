[package]
name = "jott"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Jott — local-first tasks and notes"
default-run = "jott"

[lib]
name = "jott_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# The mock runtime lets the bridge be tested without opening a window.
tauri = { version = "2", features = ["test"] }
tempfile = "3.14"

[dependencies]
jott-core = { path = "../core" }
# `protocol-asset`: the URL an <img> can load a file of the notebook from
# (banners and inline images, 2026-08-18). It answers only for paths in the
# scope, which is empty in tauri.conf.json and filled at runtime with the open
# notebook's `assets/` folder — see `commands::allow_assets`.
# `tray-icon`: the icon the app lives in after its window is closed
# (`tray.rs`, 2026-08-25) — what lets a reminder ring with no window open.
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
# Opens the release page in the system browser when an update cannot install
# itself (a .deb/.rpm/pacman install, and Android — there it becomes an
# intent). The whole reason it exists here is the update notice's button.
tauri-plugin-opener = "2"
# The system's notification, for a task's reminder (2026-08-25). On Android
# it also carries the SCHEDULE: the plugin hands the moment to AlarmManager
# and re-registers it after a reboot, so a reminder rings with the app dead.
# On desktop the shell keeps the timer itself and only asks it to show.
tauri-plugin-notification = "2"
serde.workspace = true
serde_json.workspace = true
# The wall clock, for the one thing on this side that reads it: when a notebook
# was last opened, which the picker turns into "42 min ago". The core is not
# allowed to (`core/tests/invariants.rs`) — the logical day is `clock.rs`'s —
# and this is not a date on the calendar, it is a stamp on a machine preference.
chrono.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }

# The desktop's own icon for a kind of file, for the chip a non-drawable file
# gets inside a note (`commands::file_icon`, 2026-08-19). Pinned to the exact
# versions Tauri's own window stack already links, so the binary carries ONE
# GTK and not two.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gio = "0.18"
gdk = "0.18"
# The notification plugin shows and forgets; on Linux the D-Bus notification
# can also be CLICKED, and that is how a reminder opens its task. Same crate
# and version the plugin links, so the binary carries one.
notify-rust = "4.11"

# In-place updates exist only where a file can replace itself: the AppImage
# and the Windows installer. A .deb/.rpm/pacman install belongs to a package
# manager and an APK to Android's installer, so the plugins are not even
# compiled there — the notice falls back to opening the release page.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Start with the session, hidden in the tray, so reminders ring on a machine
# that never opened the window that day (2026-08-25). A switch in Settings.
tauri-plugin-autostart = "2"
# One process per machine. Closing the window only HIDES it (`tray.rs`), so a
# launch from the desktop icon would otherwise start a SECOND app — a second
# tray icon, a second reminder timer. The second process hands over and dies.
tauri-plugin-single-instance = "2"
