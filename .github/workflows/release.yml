# Builds the downloadable packages for a tagged version.
#
# This workflow is not a convenience: Windows installers can only be assembled
# on Windows, and no Windows machine takes part in developing Jott. Without it,
# one of the three supported platforms simply has no build.
#
# Push a tag to run it:
#
#   git tag v0.8.0 && git push origin v0.8.0
#
# It leaves a DRAFT release with the artifacts attached, so the notes can be
# written and the files checked before anything becomes public.
name: release

on:
  push:
    tags: ['v*']
  # Lets a build be triggered by hand from the Actions tab, without a tag —
  # useful to prove the pipeline still works before cutting a real version.
  workflow_dispatch:

jobs:
  package:
    permissions:
      contents: write

    strategy:
      # One platform failing must not cancel the other: a broken Windows build
      # is no reason to lose a working Linux one.
      fail-fast: false
      matrix:
        include:
          # Built on the OLDEST supported Ubuntu on purpose. A binary linked
          # against a new glibc refuses to start on older distributions, and
          # the AppImage exists precisely for the distributions we do not know.
          - platform: ubuntu-22.04
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # webkit2gtk is what Tauri draws the window with on Linux; patchelf is
      # what the AppImage tooling uses to rewrite library paths.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # The suites run here rather than in a separate workflow so that a tag
      # cannot produce installers from a commit that does not pass its tests.
      - run: npm test
      - run: cargo test --workspace

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The strip inside linuxdeploy does not understand the .relr.dyn ELF
          # section current toolchains emit, and fails on every library it
          # touches. Skipping it costs some size and is the only way the
          # AppImage builds at all. (Found the hard way, 2026-08-14.)
          NO_STRIP: 'true'
          # Signs the updater artifacts (the .sig beside the AppImage and the
          # .exe) so an installed app can verify a download against the public
          # key baked into tauri.conf.json. With these set, the action also
          # writes latest.json into the release — the file the in-app check
          # reads. Losing this key breaks the update chain for every install
          # out there; the backup lives in the private jott-vault repository.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Jott ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          releaseBody: |
            Jott ${{ github.ref_name }}

            Tasks and notes that live on your computer, in plain Markdown
            files you can open without the app. No account, no server, no
            internet required. Linux, Windows and Android from one codebase.

            **Linux** — `.AppImage` runs anywhere (`chmod +x`, then run; to
            remove it, delete the file). `.deb` and `.rpm` for Debian/Ubuntu
            and Fedora install into the applications menu and uninstall
            through the package manager. On Arch, build the `PKGBUILD` in
            `packaging/`.

            **Windows** — run the `.exe` installer. It installs for the
            current user (no administrator password), adds a Start Menu entry
            and uninstalls from Settings → Apps.

            **Android** — download the `.apk` and open it; Android asks once
            to allow installs from your browser. A newer APK installs over
            the old one, keeping your data. Uninstall like any app.

            **Updating** — Jott checks GitHub once a day (it can be turned
            off in Settings) and shows a notice when a new version is out.
            The AppImage and the Windows build update themselves in place;
            package-manager installs and the APK are pointed back to this
            page. `latest.json` is what that check reads — it carries the
            signature that proves a download is genuine. It is not a download.

            Jott is not code-signed. A certificate would not switch the
            warning off either — since 2024 Microsoft makes every certificate
            build reputation from downloads — but it would move that
            reputation from the file to the certificate, so it stops starting
            over with each version. On first run Windows shows "Windows
            protected your PC" — click **More info**, then **Run anyway**.

  # The bundler writes a .sig beside every artifact it signs, and the action
  # uploads all of them. None is ever fetched: the updater reads `latest.json`,
  # which carries each signature INLINE — the 416 bytes in the `signature` field
  # are byte for byte the .sig file. So they are four rows on the release page
  # that nobody downloads and that make the real installers harder to find.
  #
  # A separate job because the matrix legs upload in parallel: cleaning up from
  # inside one of them could run before the other has finished uploading.
  tidy:
    needs: package
    # `always()` so a broken Windows leg still leaves a tidy Linux release, and
    # the tag guard because a manual `workflow_dispatch` run has no release to
    # clean — `github.ref_name` would be a branch.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Drop the .sig assets from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # If both legs failed there is no release at all; that is not a
          # reason to fail the run on top of the failure that caused it.
          if ! sigs=$(gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null); then
            echo "No release for $TAG — nothing to tidy."
            exit 0
          fi
          sigs=$(printf '%s\n' "$sigs" | grep '\.sig$' || true)
          if [ -z "$sigs" ]; then
            echo "No .sig assets on $TAG."
            exit 0
          fi
          printf '%s\n' "$sigs" | while read -r asset; do
            echo "Removing $asset"
            gh release delete-asset "$TAG" "$asset" --yes
          done
