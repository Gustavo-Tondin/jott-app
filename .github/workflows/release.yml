# Builds the downloadable packages for a tagged version.
#
# This workflow is not a convenience: Windows installers can only be assembled
# on Windows, and no Windows machine takes part in developing Jott. Without it,
# one of the three supported platforms simply has no build.
#
# Push a tag to run it:
#
#   git tag v0.8.0 && git push origin v0.8.0
#
# It leaves a DRAFT release with the artifacts attached, so the notes can be
# written and the files checked before anything becomes public.
name: release

on:
  push:
    tags: ['v*']
  # Lets a build be triggered by hand from the Actions tab, without a tag —
  # useful to prove the pipeline still works before cutting a real version.
  workflow_dispatch:

jobs:
  package:
    permissions:
      contents: write

    strategy:
      # One platform failing must not cancel the other: a broken Windows build
      # is no reason to lose a working Linux one.
      fail-fast: false
      matrix:
        include:
          # Built on the OLDEST supported Ubuntu on purpose. A binary linked
          # against a new glibc refuses to start on older distributions, and
          # the AppImage exists precisely for the distributions we do not know.
          - platform: ubuntu-22.04
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # webkit2gtk is what Tauri draws the window with on Linux; patchelf is
      # what the AppImage tooling uses to rewrite library paths.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # The runner ships third-party apt lists we do not use, and one of
          # them failing takes the whole `update` down with it (exit 100 on a
          # Google Chrome "Hash Sum mismatch", 2026-09-09) — a release stopped
          # for a repository none of these packages come from. Drop them.
          sudo rm -f /etc/apt/sources.list.d/*google-chrome* /etc/apt/sources.list.d/*microsoft*
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # The suites run here rather than only in `test.yml` so that a tag
      # cannot produce installers from a commit that does not pass its tests.
      #
      # Rust FIRST, and on purpose: it is the suite that only a real Windows
      # can host — wine cannot run the watcher or anything that needs a
      # WebView2 — so when a leg fails it must be the one that failed, not a
      # frontend flake standing in front of it. jsdom runs the same anywhere.
      - run: cargo test --workspace
      - run: npm test

      # The notes are composed, not typed into this file.
      #
      # Half of the page is the same every release — WHICH FILE DO I CLICK —
      # and it is the half a first-time visitor needs; it lives right here,
      # beside the names the next job gives those files. The other half is
      # what changed, and that is written while the code is written, in
      # CHANGELOG.md, one `## vX.Y.Z` section per version.
      #
      # `github.ref_name` is the tag for a real release and a BRANCH for a
      # manual workflow_dispatch run, so a missing section is normal and never
      # fails the build — it degrades to a link to the commits.
      #
      # The heredoc body sits flush against the left margin because a heredoc
      # keeps every leading space; YAML strips this block's own indentation,
      # so "flush left here" is "flush left in the script".
      - name: Compose the release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          changed="$(awk -v want="## v$version" '
            $0 == want { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md)"
          # Trim the blank lines the section starts and ends with.
          changed="$(printf '%s\n' "$changed" | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac)"

          {
          cat <<'INSTALL'
          ## Install

          | Your system | Download | Then |
          |---|---|---|
          | **Windows** | `jott-windows.exe` | Run it — no administrator password. Windows says *"Windows protected your PC"*: click **More info**, then **Run anyway** (Jott is not code-signed). |
          | **Ubuntu / Debian** | `jott-ubuntu.deb` | Open the file, or `sudo apt install ./jott-ubuntu.deb` |
          | **Fedora** | `jott-fedora.rpm` | Open the file, or `sudo dnf install ./jott-fedora.rpm` |
          | **Any other Linux** | `jott-linux.AppImage` | `chmod +x jott-linux.AppImage`, then run it. On Arch, build `packaging/linux/PKGBUILD`. |
          | **Android** | `jott-android.apk` | Open this page **on the phone**, download it and tap the file. Android asks once to allow installs from your browser. |

          Jott checks for a new version once a day, and that is the only connection it
          makes — turn it off in Settings. The AppImage and the Windows build update
          themselves; the other packages bring you back to this page. `latest.json` is
          that check, not a download.
          INSTALL
            echo
            echo "## What changed"
            echo
            if [ -n "$changed" ]; then
              printf '%s\n' "$changed"
            else
              echo "See the [commits](https://github.com/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME)."
            fi
          } > "$RUNNER_TEMP/notes.md"

          cat "$RUNNER_TEMP/notes.md"
          {
            echo 'body<<JOTT_NOTES_EOF'
            cat "$RUNNER_TEMP/notes.md"
            echo 'JOTT_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The strip inside linuxdeploy does not understand the .relr.dyn ELF
          # section current toolchains emit, and fails on every library it
          # touches. Skipping it costs some size and is the only way the
          # AppImage builds at all. (Found the hard way, 2026-08-14.)
          NO_STRIP: 'true'
          # Signs the updater artifacts (the .sig beside the AppImage and the
          # .exe) so an installed app can verify a download against the public
          # key baked into tauri.conf.json. With these set, the action also
          # writes latest.json into the release — the file the in-app check
          # reads. Losing this key breaks the update chain for every install
          # out there; the backup lives in the private jott-vault repository.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Jott ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          releaseBody: ${{ steps.notes.outputs.body }}

  # Makes the release page usable by someone who has never seen it. Two
  # duties, in this order.
  #
  # ONE — drop the .sig assets. The bundler writes a .sig beside every artifact
  # it signs, and the action uploads all of them. None is ever fetched: the
  # updater reads latest.json, which carries each signature INLINE — the 416
  # bytes in the `signature` field are byte for byte the .sig file. So they are
  # four rows on the release page that nobody downloads and that make the real
  # installers harder to find.
  #
  # TWO — rename the installers to say what they are. The bundler names them
  # after itself (Jott_0.50.4_amd64.deb, Jott-0.50.4-1.x86_64.rpm,
  # Jott_0.50.4_x64-setup.exe), which asks a first-time visitor to decode a
  # filename to find their own operating system. They become jott-ubuntu.deb,
  # jott-fedora.rpm, jott-windows.exe, jott-linux.AppImage — and the version
  # leaves the name, because the release above it already says the version.
  #
  # THE TRAP IN TWO: latest.json points AT those files, by URL. Rename an asset
  # and leave it alone and every installed AppImage and .exe gets a 404 the
  # next time it updates itself. So latest.json is rewritten with the new names
  # and uploaded again. The signature covers the file's BYTES, not its name, so
  # it stays valid — and the release is still a draft here, so the seconds
  # between the delete and the upload are not seconds anyone can read.
  #
  # A separate job because the matrix legs upload in parallel: doing this from
  # inside one of them could run before the other has finished uploading.
  assets:
    needs: package
    # `always()` so a broken Windows leg still leaves a tidy Linux release, and
    # the tag guard because a manual `workflow_dispatch` run has no release to
    # clean — `github.ref_name` would be a branch.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Tidy and rename the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"

          # The release is a DRAFT (releaseDraft: true above), and a draft is
          # invisible to every lookup BY TAG: `GET /releases/tags/{tag}` —
          # which is what `gh release view <tag>` and `gh release
          # delete-asset <tag>` both call — answers 404 until the release is
          # published. This job used to do exactly that and reported success
          # while deleting nothing: the v0.36.1 run logged "No release for
          # v0.36.1 — nothing to tidy" with four .sig sitting on the draft
          # (measured 2026-08-24). Drafts are only reachable by LISTING the
          # releases and matching `tag_name`, so that is what this does, and
          # the assets go by id.
          id=$(gh api "repos/$REPO/releases" --paginate \
                 --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)
          # If both legs failed there is no release at all; that is not a
          # reason to fail the run on top of the failure that caused it.
          if [ -z "$id" ]; then
            echo "No release for $TAG — nothing to do."
            exit 0
          fi
          echo "Release $TAG is id $id."

          gh api "repos/$REPO/releases/$id/assets" --paginate \
            --jq '.[] | "\(.id)\t\(.name)"' > assets.tsv
          cat assets.tsv

          while IFS=$'\t' read -r asset_id name; do
            case "$name" in
              *.sig)
                echo "Removing $name"
                gh api -X DELETE "repos/$REPO/releases/assets/$asset_id" >/dev/null
                ;;
            esac
          done < assets.tsv

          # Only the five names we publish are touched. Anything else — an
          # updater archive, something uploaded by hand — keeps its name, and
          # so keeps whatever latest.json says about it.
          : > renames.tsv
          while IFS=$'\t' read -r asset_id name; do
            case "$name" in
              *.AppImage) clear=jott-linux.AppImage ;;
              *.deb)      clear=jott-ubuntu.deb ;;
              *.rpm)      clear=jott-fedora.rpm ;;
              *.exe)      clear=jott-windows.exe ;;
              *.apk)      clear=jott-android.apk ;;
              *)          continue ;;
            esac
            [ "$name" = "$clear" ] && continue
            echo "Renaming $name -> $clear"
            gh api -X PATCH "repos/$REPO/releases/assets/$asset_id" \
              -f name="$clear" >/dev/null
            printf '%s\t%s\n' "$name" "$clear" >> renames.tsv
          done < assets.tsv

          json_id=$(awk -F'\t' '$2 == "latest.json" { print $1 }' assets.tsv | head -1)
          if [ -z "$json_id" ]; then
            echo "No latest.json on this release."
            exit 0
          fi

          gh api "repos/$REPO/releases/assets/$json_id" \
            -H "Accept: application/octet-stream" > latest.json
          python3 - <<'PY'
          import json
          import pathlib

          renames = dict(
              line.split("\t")
              for line in pathlib.Path("renames.tsv").read_text().splitlines()
              if line
          )
          manifest = pathlib.Path("latest.json")
          data = json.loads(manifest.read_text())
          for platform in data.get("platforms", {}).values():
              url = platform.get("url", "")
              folder, _, filename = url.rpartition("/")
              if filename in renames:
                  platform["url"] = f"{folder}/{renames[filename]}"
                  print(f"latest.json: {filename} -> {renames[filename]}")
          manifest.write_text(json.dumps(data, indent=2))
          PY

          # It goes back up under its own name. It carried a label for one
          # release — "Update manifest — not a download", which GitHub shows in
          # place of the filename — and it reads better without it: the file is
          # called latest.json, and the name says more than a note about it.
          #
          # The row cannot come off the page either way: the URL
          # `releases/latest/download/latest.json` is compiled into every copy
          # of Jott already installed, in two places (the updater plugin's
          # endpoint in tauri.conf.json, and UPDATE_MANIFEST_URL in
          # commands/update.rs). Delete the asset and the daily check 404s for
          # everyone out there, silently and forever.
          gh api -X DELETE "repos/$REPO/releases/assets/$json_id" >/dev/null
          gh api --method POST \
            "https://uploads.github.com/repos/$REPO/releases/$id/assets?name=latest.json" \
            -H "Content-Type: application/json" \
            --input latest.json >/dev/null
          echo "latest.json rewritten and uploaded."
