name: Feature proposal
description: A concrete change you'd like to see — check the roadmap first.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Part of the design is already decided: see the [roadmap](https://github.com/Gustavo-Tondin/jott-app#roadmap)
        and [extending Jott](https://github.com/Gustavo-Tondin/jott-app/blob/main/documentation/plugins.md).
        If the idea is still loose, [Ideas](https://github.com/Gustavo-Tondin/jott-app/discussions/categories/ideas) is the better place.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and where Jott gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Effect on the files
      description: Everything lives in plain Markdown you can open without the app. Would this change what gets written to disk?
  - type: checkboxes
    id: pr
    attributes:
      label: Contributing
      options:
        - label: I'd like to write this myself.
