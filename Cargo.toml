[workspace]
members = ["core", "src-tauri"]
resolver = "2"

[workspace.package]
# THE version of Jott. It lives here and nowhere else.
#
# Cargo is the only one of the four tools involved that cannot read a version
# from another file — a manifest needs the literal string — so the one place
# that cannot move is the one place that holds it. Everything else derives:
# core/ and src-tauri/ inherit with `version.workspace = true`, the runtime
# reads `CARGO_PKG_VERSION`, tauri.conf.json omits `version` so the Tauri CLI
# falls back to this manifest, and packaging/PKGBUILD reads this line.
#
# Editing it by hand is fine; `scripts/release.sh <version>` does it and then
# proves every derivation still lands on the same number.
version = "0.24.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
notify = "6.1"
thiserror = "1.0"
